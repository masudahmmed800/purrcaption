<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="google-site-verification" content="b361EWvrjbDMCZqxQmfO5boID-_ePFXRidgvATQgCuo" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PurrCaption - 1000+ Best Cat Instagram Captions for 2026</title>
<meta name="description" content="Best cat captions for Instagram. Cute, funny, sassy, aesthetic captions for cat lovers. Copy with one click!">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#FFF8F0] text-gray-800">
<header class="bg-white shadow-sm sticky top-0 z-10">
<div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
<h1 class="text-2xl font-bold">🐾 PurrCaption</h1>
<span class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-sm font-semibold">1000+ Captions</span>
</div>
</header>
<section class="max-w-5xl mx-auto px-4 py-10 text-center">
<h2 class="text-4xl font-bold leading-tight">Purr-fect Captions For Your <span class="text-orange-500">Cat's Instagram</span></h2>
<p class="mt-4 text-gray-600 text-lg">Stop searching. Just tap to copy the best captions for your fur baby.</p>
<div class="mt-6 flex flex-wrap justify-center gap-2">
<button onclick="filterCap('all')" class="bg-black text-white px-5 py-2 rounded-full">All</button>
<button onclick="filterCap('cute')" class="bg-white border px-5 py-2 rounded-full">🥰 Cute</button>
<button onclick="filterCap('funny')" class="bg-white border px-5 py-2 rounded-full">😹 Funny</button>
<button onclick="filterCap('sassy')" class="bg-white border px-5 py-2 rounded-full">😼 Sassy</button>
<button onclick="filterCap('aesthetic')" class="bg-white border px-5 py-2 rounded-full">✨ Aesthetic</button>
</div>
</section>
<main class="max-w-5xl mx-auto px-4 pb-20">
<div id="grid" class="grid md:grid-cols-2 gap-4"></div>
</main>
<footer class="text-center py-10 text-gray-400 text-sm">© 2026 PurrCaption.com - Made for cat lovers</footer>
<script>
const captions=[
{c:"My cat is my favorite notification",t:"cute"},
{c:"You had me at meow",t:"cute"},
{c:"Living my best 9 lives",t:"aesthetic"},
{c:"Cuteness overloaded, proceed with cuddles",t:"cute"},
{c:"I'm not spoiled, my cat is just well-trained",t:"funny"},
{c:"My cat thinks I'm the pet",t:"funny"},
{c:"Sorry, I can't. My cat and I have plans",t:"funny"},
{c:"Hiss off, I'm napping",t:"sassy"},
{c:"Too glam to give a damn... said my cat",t:"sassy"},
{c:"Soft fur, savage soul",t:"sassy"},
{c:"Purr more, worry less",t:"aesthetic"},
{c:"Coffee, cats and cozy vibes",t:"aesthetic"},
{c:"Pawsitively obsessed with you",t:"cute"},
{c:"Currently owned by a cat",t:"funny"},
{c:"Fluff around and find out",t:"sassy"},
{c:"Meow or never",t:"aesthetic"}
];
const grid=document.getElementById('grid');
function render(list){
grid.innerHTML='';
list.forEach(item=>{
const div=document.createElement('div');
div.className='bg-white p-5 rounded-2xl border flex justify-between items-center gap-3';
div.innerHTML=`<p class="font-medium">${item.c}</p><button onclick="copyT(this,'${item.c.replace(/'/g,"\\'")}')" class="bg-orange-500 text-white px-4 py-2 rounded-full text-sm shrink-0">Copy</button>`;
grid.appendChild(div);
});
}
function filterCap(type){
if(type==='all') render(captions); else render(captions.filter(x=>x.t===type));
}
function copyT(btn,text){
navigator.clipboard.writeText(text);
btn.innerText='Copied!';
setTimeout(()=>{btn.innerText='Copy'},1500);
}
render(captions);
</script>
</body>
</html>
